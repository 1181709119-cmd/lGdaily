name: Publish latest carousel

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: carousel-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify latest page and prepare clean deployment
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          source = Path('site/index.html')
          html = source.read_text(encoding='utf-8-sig')
          if '<html' not in html.lower() or '</html>' not in html.lower() or '__DATA__' in html:
              raise SystemExit('Missing or incomplete carousel HTML')
          Path('_published').mkdir()
          shutil.copyfile(source, '_published/index.html')
          Path('_published/.nojekyll').touch()
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _published
      - name: Wait for publication artifact to become available
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json, os, time
          from urllib.request import Request, urlopen
          url = f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/actions/runs/{os.environ['GH_RUN_ID']}/artifacts"
          for attempt in range(12):
              request = Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urlopen(request, timeout=20) as response:
                  artifacts = json.load(response)['artifacts']
              if any(a['name'] == 'github-pages' and not a['expired'] for a in artifacts):
                  print('Publication artifact is available.')
                  break
              time.sleep(5)
          else:
              raise SystemExit('Publication artifact was not visible after waiting.')
          PY
      - name: Publish Pages
        id: deploy
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const result = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id: context.runId});
            const artifact = result.data.artifacts.find(a => a.name === 'github-pages' && !a.expired);
            if (!artifact) throw new Error('Verified Pages artifact missing');
            const oidc = await core.getIDToken();
            const deployment = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              owner, repo, artifact_id: artifact.id, pages_build_version: context.sha, oidc_token: oidc
            });
            core.setOutput('page_url', deployment.data.page_url);
            for (let i=0; i<120; i++) {
              const status = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                owner, repo, deployment_id: deployment.data.id
              });
              if (status.data.status === 'succeed') { core.info('Pages deployment succeeded'); return; }
              if (['deployment_failed','deployment_content_failed','deployment_cancelled','deployment_lost'].includes(status.data.status)) {
                throw new Error('Pages: '+status.data.status);
              }
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
            throw new Error('Pages deployment timed out');
